name: Auto Update (Trigger CF Pages Build)

on:
  schedule:
    # 每2小时运行一次
    - cron: '0 */2 * * *'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update timestamp
        run: |
          echo "# Auto updated at $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .last-update
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last-update
          git commit -m "chore: auto update $(date -u '+%Y-%m-%d %H:%M')" || echo "No changes"
          git push origin main || echo "Nothing to push"
