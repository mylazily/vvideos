<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    
    <!-- Favicon -->
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    
    <!-- SEO -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="baiduspider" content="index, follow" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="canonical" href="https://evideos.pages.dev/" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="必爱必爱" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:type" content="website" />
    
    <!-- 预连接：加速图片CDN -->
    <link rel="preconnect" href="https://xinlangtupian.com" crossorigin />
    <link rel="dns-prefetch" href="https://xinlangtupian.com" />
    
    <!-- 预连接：加速常用流媒体CDN -->
    <link rel="preconnect" href="https://bfzyapi.com" crossorigin />
    <link rel="dns-prefetch" href="https://bfzyapi.com" />
    <link rel="preconnect" href="https://lzyapi.com" crossorigin />
    <link rel="dns-prefetch" href="https://lzyapi.com" />
    
    <!-- HLS.js 预加载（关键优化） -->
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.light.min.js" as="script" crossorigin="anonymous" />
    
    <style>
      html { background-color: #f9fafb; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
    
    %sveltekit.head%
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
    <script>
    // ===== HLS.js 同步加载（确保在页面渲染前可用） =====
    (function(){
      if (typeof Hls !== 'undefined') return;
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.light.min.js';
      s.async = false;  // 改为同步加载，确保 HLS.js 立即可用
      s.crossOrigin = 'anonymous';
      document.head.appendChild(s);
    })();

    // ===== 视频页极速预取（并行加载） =====
    var _VPD = {};
    (function(){
      var m = location.pathname.match(/^\/v\/([^\/]+)/);
      if (!m) return;
      var vid = m[1];
      
      // 并行加载视频数据和 HLS.js（HLS.js 已经在上面同步加载）
      Promise.all([
        // 加载视频详情
        fetch('/api/video/' + vid, { signal: AbortSignal.timeout(8000) })
          .then(function(r) { return r.json(); }),
        // 加载相关视频
        fetch('/api/video/' + vid + '/related', { signal: AbortSignal.timeout(5000) })
          .then(function(r) { return r.json(); }).catch(function() { return { data: [] }; })
      ]).then(function(results) {
        var videoData = results[0];
        var relatedData = results[1];
        
        if (videoData && videoData.success && videoData.data) {
          _VPD.video = videoData.data;
          _VPD.related = relatedData.data || [];
          
          // 预连接流媒体域名
          var sources = videoData.data.play_sources || [];
          if (sources.length > 0) {
            try {
              var rawUrl = sources[0].url || '';
              var playUrl = rawUrl;
              if (rawUrl.indexOf('$') > -1) {
                var parts = rawUrl.split('#');
                var firstEp = parts[0];
                var dollarIdx = firstEp.indexOf('$');
                if (dollarIdx > -1) playUrl = firstEp.substring(dollarIdx + 1);
              }
              var host = new URL(playUrl).host;
              if (host && host !== location.host) {
                var link = document.createElement('link');
                link.rel = 'preconnect';
                link.href = 'https://' + host;
                link.crossOrigin = '';
                document.head.appendChild(link);
              }
            } catch(e) {}
          }
        }
      }).catch(function() {});
    })();

    // ===== 首页专用：纯原生JS动态加载视频列表 =====
    if (location.pathname === '/' && document.getElementById('vg')) {
      var _t;
      function _esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
      function _card(v, i) {
        return '<a href="/v/' + v.vod_id + '" data-vid="' + _esc(v.vod_id) + '" class="group block"><div class="relative aspect-video bg-gray-200 rounded-lg overflow-hidden"><img src="' + _esc(v.cover) + '" alt="' + _esc(v.title) + '" ' + (i < 4 ? 'fetchpriority="high"' : 'loading="lazy"') + ' decoding="' + (i < 4 ? 'sync' : 'async') + '" class="absolute inset-0 w-full h-full object-cover" onerror="this.style.display=\'none\'"/></div><h3 class="mt-1.5 text-sm text-gray-800 line-clamp-2 group-hover:text-pink-500 transition-colors">' + _esc(v.title) + '</h3></a>';
      }
      function _render(list) {
        var g = document.getElementById('vg'); if (!g) return;
        if (!list || !list.length) { g.className = 'text-center py-20 text-gray-400'; g.innerHTML = '暂无数据'; return; }
        g.className = 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-2 p-2';
        var seen = {}, out = [];
        for (var i = 0; i < list.length; i++) { var v = list[i]; if (!seen[v.vod_id]) { seen[v.vod_id] = 1; out.push(_card(v, out.length)); } }
        g.innerHTML = out.join('');
        _bindPrefetch(g);
      }
      var _prefetched = {};
      function _bindPrefetch(g) {
        g.addEventListener('mouseover', function(e) {
          var a = e.target.closest('a[data-vid]');
          if (a) _prefetch(a.dataset.vid);
        }, { passive: true });
        g.addEventListener('touchstart', function(e) {
          var a = e.target.closest('a[data-vid]');
          if (a) _prefetch(a.dataset.vid);
        }, { passive: true });
      }
      function _prefetch(vid) {
        if (_prefetched[vid]) return;
        _prefetched[vid] = 1;
        fetch('/api/video/' + vid, { signal: AbortSignal.timeout(5000) }).catch(function() {});
      }
      function _refresh() {
        clearTimeout(_t); _t = setTimeout(function() {
          fetch('/api/home').then(function(r) { return r.json(); }).then(function(j) {
            if (j.success && j.data) { var a = j.data.latest || [], b = j.data.hot || []; _render(a.concat(b)); }
          }).catch(function() {});
        }, 100);
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', _refresh); else _refresh();
    }
    </script>
  </body>
</html>
