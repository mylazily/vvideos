<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    
    <!-- Favicon -->
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    
    <!-- SEO -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="baiduspider" content="index, follow" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="canonical" href="https://evideos.pages.dev/" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="必爱必爱" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%sveltekit.assets%/icon.svg" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    
    <!-- 预连接：加速图片CDN和API -->
    <link rel="preconnect" href="https://xinlangtupian.com" crossorigin />
    <link rel="dns-prefetch" href="https://xinlangtupian.com" />
    
    <!-- 关键CSS内联 -->
    <style>
      html { background-color: #f9fafb; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
    
    %sveltekit.head%
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
