<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    
    <!-- DNS预解析和预连接 -->
    <link rel="dns-prefetch" href="//evideos.pages.dev" />
    <link rel="preconnect" href="https://evideos.pages.dev" crossorigin />
    
    <!-- Favicon -->
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ec4899" />
    <meta name="msapplication-TileColor" content="#ec4899" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="必爱必爱" />
    
    <!-- SEO 基础 -->
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="baiduspider" content="index, follow" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="canonical" href="https://evideos.pages.dev/" />

    <!-- Open Graph 基础 -->
    <meta property="og:site_name" content="必爱必爱" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%sveltekit.assets%/icon.svg" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    
    <!-- 预加载关键资源 -->
    <link rel="preload" href="/icon.svg" as="image" type="image/svg+xml" />
    
    <!-- 关键CSS内联 -->
    <style>
      /* 首屏关键样式 - 防止FOUC */
      html { background-color: #f9fafb; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      /* 骨架屏样式 */
      .skeleton { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
      @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
    
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
    
    <!-- Service Worker 注册 - 延迟加载 -->
    <script>
      if ('serviceWorker' in navigator) {
        // 使用 requestIdleCallback 延迟注册，不阻塞首屏
        const registerSW = function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            reg.onupdatefound = function() {
              var newWorker = reg.installing;
              newWorker.onstatechange = function() {
                if (newWorker.state === 'activated') {
                  // 新版本可用
                }
              };
            };
          }).catch(function() {});
        };
        
        // 延迟注册Service Worker
        if ('requestIdleCallback' in window) {
          window.requestIdleCallback(registerSW, { timeout: 5000 });
        } else {
          setTimeout(registerSW, 3000);
        }
      }
    </script>
  </body>
</html>
