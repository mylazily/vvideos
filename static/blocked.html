<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>请使用Chrome或Edge浏览器访问 - 必爱必爱</title>
  <meta name="robots" content="noindex">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .icon {
      width: 80px;
      height: 80px;
      background: #f3f4f6;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 40px;
    }
    h1 {
      font-size: 22px;
      color: #1f2937;
      margin-bottom: 12px;
    }
    p {
      color: #6b7280;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .browsers {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 28px;
    }
    .browser {
      flex: 1;
      max-width: 140px;
      padding: 16px 12px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s;
    }
    .browser:hover {
      border-color: #ec4899;
      transform: translateY(-2px);
    }
    .browser-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 8px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .chrome .browser-icon { background: #fef3c7; }
    .edge .browser-icon { background: #dbeafe; }
    .browser-name {
      font-weight: 600;
      color: #1f2937;
      font-size: 14px;
    }
    .browser-tag {
      font-size: 12px;
      color: #ec4899;
      margin-top: 4px;
    }
    .tips {
      background: #fef3c7;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
    }
    .tips-title {
      font-weight: 600;
      color: #92400e;
      font-size: 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tips-list {
      list-style: none;
      font-size: 13px;
      color: #a16207;
    }
    .tips-list li {
      padding: 4px 0;
      padding-left: 16px;
      position: relative;
    }
    .tips-list li::before {
      content: "•";
      position: absolute;
      left: 4px;
    }
    .pwa-tip {
      margin-top: 20px;
      padding: 16px;
      background: #ecfdf5;
      border-radius: 12px;
      border: 1px solid #a7f3d0;
    }
    .pwa-tip-title {
      font-weight: 600;
      color: #065f46;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .pwa-tip-text {
      font-size: 13px;
      color: #047857;
      line-height: 1.5;
    }
    .copy-btn {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      background: #ec4899;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .copy-btn:active {
      transform: scale(0.98);
    }
    .url-box {
      margin-top: 12px;
      padding: 12px;
      background: #f3f4f6;
      border-radius: 8px;
      font-size: 13px;
      color: #6b7280;
      word-break: break-all;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🔒</div>
    <h1>当前浏览器无法访问</h1>
    <p>您正在使用的内置浏览器限制了视频播放功能，请使用以下推荐浏览器访问本站</p>
    
    <div class="browsers">
      <a href="https://www.google.com/chrome/" class="browser chrome" target="_blank">
        <div class="browser-icon">🌐</div>
        <div class="browser-name">Chrome</div>
        <div class="browser-tag">推荐</div>
      </a>
      <a href="https://www.microsoft.com/edge" class="browser edge" target="_blank">
        <div class="browser-icon">🌊</div>
        <div class="browser-name">Edge</div>
        <div class="browser-tag">推荐</div>
      </a>
    </div>
    
    <div class="tips">
      <div class="tips-title">📱 微信/QQ/抖音内打开？</div>
      <ul class="tips-list">
        <li>点击右上角「···」菜单</li>
        <li>选择「在浏览器中打开」</li>
        <li>或「复制链接」到Chrome/Edge访问</li>
      </ul>
    </div>
    
    <div class="pwa-tip">
      <div class="pwa-tip-title">📲 添加到主屏幕</div>
      <div class="pwa-tip-text">
        使用Chrome/Edge访问时，点击菜单「添加到主屏幕」，即可像APP一样使用，无需下载安装包
      </div>
    </div>
    
    <button class="copy-btn" onclick="copyUrl()">复制网址链接</button>
    <div class="url-box" id="urlBox">https://evideos.pages.dev/</div>
  </div>
  
  <script>
    function copyUrl() {
      const url = 'https://evideos.pages.dev/';
      if (navigator.clipboard) {
        navigator.clipboard.writeText(url);
      } else {
        const input = document.createElement('input');
        input.value = url;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
      }
      const btn = document.querySelector('.copy-btn');
      btn.textContent = '✓ 已复制';
      setTimeout(() => btn.textContent = '复制网址链接', 2000);
    }
    document.getElementById('urlBox').textContent = location.origin + '/';
  </script>
</body>
</html>
